<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Metrics Graph</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e6f3ff 0%, #e6fff7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        h1 {
            color: #1a91ff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .graph-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        .graph-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .back-button {
            background: linear-gradient(135deg, #1a91ff, #0055b3);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26, 145, 255, 0.2);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                margin: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Health Metrics Visualization</h1>
        <div class="graph-container">
            <img src="data:image/png;base64,{{ graph_data }}" alt="Health Metrics Graph">
        </div>
        <div style="text-align: center;">
            <a href="http://localhost:5003" class="back-button">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
